databases:
  - name: paywall-ai-db
    plan: free
    databaseName: paywall_ai
    user: paywall_ai

services:
  - type: web
    name: paywall-ai-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      # Render's free web services have an EPHEMERAL filesystem — a local
      # sqlite file gets wiped on every restart/spin-down. Use the Postgres
      # instance above instead, which persists independently of the web
      # service's lifecycle.
      - key: DATABASE_URL
        fromDatabase:
          name: paywall-ai-db
          property: connectionString
      - key: ALLOW_ORIGINS
        value: https://paywall-ai-orcin.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: SECRET_KEY
        sync: false
